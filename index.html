
<!DOCTYPE html>
<html>
<head>
    <title>4-Bit Counter Simulator</title>

    <link rel="stylesheet" href="stylee.css">
</head>

<body>

    <header>
        <h1>4-Bit Counter Simulator</h1>
        <p>Digital Binary Counting System</p>
    </header>

    <div id="input-area">
        <h2>Counter Controls</h2>

        <button onclick="upCounter()">UP</button>
        <button onclick="downCounter()">DOWN</button>
        <button type="button">CLOCK</button>
        <button onclick="resetCounter()">RESET</button>

        <br>

        <button onclick="startAuto('up')">AUTO UP</button>
        <button onclick="startAuto('down')">AUTO DOWN</button>
        <button onclick="stopAuto()">STOP</button>
    </div>

    <div id="result-area">
        <h2>Counter Results</h2>

        <h3>Binary: <span id="binary">0000</span></h3>

        <h3>Decimal: <span id="decimal">0</span></h3>

        <h3>Four Bit LEDs</h3>

        <div class="leds">
            <span id="led1">⚫</span>
            <span id="led2">⚫</span>
            <span id="led3">⚫</span>
            <span id="led4">⚫</span>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
